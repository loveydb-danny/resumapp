<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>리썸 re:sum — 쪽지가 도착했어요</title>
<meta name="description" content="상대방이 어떤 장소에 쪽지를 숨겼어요. 리썸 앱에서 위치를 확인하고 직접 찾아가 보세요.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://resum.co.kr/letter/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="리썸 re:sum">
<meta property="og:title" content="리썸 쪽지가 도착했어요 💌">
<meta property="og:description" content="상대방이 숨긴 쪽지가 기다리고 있어요. 앱에서 위치를 확인하고 직접 찾아가 보세요!">
<meta property="og:image" content="https://resum.co.kr/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://resum.co.kr/letter/">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/app-icon-180.png">
<meta name="apple-itunes-app" content="app-id=6769666252">

<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ═══════════════════════════════════════════════════════════════════
   리썸 쪽지 브릿지 페이지
   랜딩(/index.html)과 동일한 컬러·서체 토큰을 사용한다.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --ink:      #1b1416;
  --paper:    #ffffff;
  --line:     #e8dfdc;
  --accent:   #e8385a;
  --blush:    #f7d3ce;
  --btn:      #171114;
  --muted:    #8a8189;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
              'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink); background:var(--paper);
  display:flex; align-items:center; justify-content:center;
  padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased;
}
.card{width:100%;max-width:360px;text-align:center;}
.app-icon{
  width:84px;height:84px;border-radius:20px;display:inline-block;
  box-shadow:0 8px 24px rgba(232,56,90,.22);
}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:22px 0 10px;line-height:1.4;}
p.lead{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 26px;}
.btn{
  display:block;width:100%;padding:16px;border-radius:12px;
  font-size:16px;font-weight:700;letter-spacing:-.01em;text-decoration:none;
  background:var(--btn);color:#fff;margin-bottom:10px;
}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line);}
.hide{display:none;}
.foot{margin-top:20px;font-size:12px;color:#b6b0b4;line-height:1.6;}
.foot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
  <main class="card">
    <img class="app-icon" src="/assets/app-icon-180.png" alt="리썸 re:sum" width="84" height="84">
    <h1>쪽지가 도착했어요 💌</h1>
    <p class="lead">상대방이 리썸에 쪽지를 숨겼어요.<br>앱에서 위치를 확인하고 직접 찾아가 보세요!</p>

    <a id="primary" class="btn" href="#">앱에서 쪽지 확인하기</a>
    <a id="ios" class="btn sub hide" href="#">App Store에서 받기</a>
    <a id="aos" class="btn sub hide" href="#">Google Play에서 받기</a>

    <div class="foot">리썸 re:sum · <a href="/">서비스 소개 보기</a></div>
  </main>

<script>
(function(){
  /* ─────────────────────────────────────────────────────────────────
     이 페이지가 눈에 보인다 = Universal Link / App Link가 걸리지 않은
     컨텍스트(카카오톡 인앱브라우저 등). 커스텀 스킴(iOS) / intent(Android)로
     앱을 직접 깨운다. 미설치자는 스킴 실행이 무시되고 스토어 버튼이 남는다.

     ⚠️ Android intent의 host가 resum.co.kr이 아니라 invite.loveydb.com인 것은
        의도된 설정이다. 현재 스토어에 배포된 앱에는 resum.co.kr 통로가 아직
        등록되어 있지 않아, 신규 도메인으로 intent를 쏘면 구버전에서 앱이 열리지
        않는다. resum.co.kr을 등록한 빌드가 충분히 퍼진 뒤 전환할 것.
        (iOS는 resum:// 스킴이 이미 앱에 등록되어 있어 구버전에서도 동작한다.)
     ───────────────────────────────────────────────────────────────── */
  var APPLE_ID='6769666252', APPLE_PT='128899102', ANDROID_PKG='com.resum.app';

  var IOS_STORE='https://apps.apple.com/app/apple-store/id'+APPLE_ID+
                '?pt='+APPLE_PT+'&ct=letter_share&mt=8';
  var AOS_STORE='https://play.google.com/store/apps/details?id='+ANDROID_PKG+'&hl=ko&referrer='+
                encodeURIComponent('utm_source=letter&utm_medium=share&utm_campaign=letter_share');

  var IOS_APP='resum://letter';
  var AOS_APP='intent://invite.loveydb.com/letter/#Intent;scheme=https;package='+ANDROID_PKG+';'+
              'S.browser_fallback_url='+encodeURIComponent(AOS_STORE)+';end';

  var ua=navigator.userAgent||'';
  var isIOS=/iPhone|iPad|iPod/i.test(ua);
  var isAndroid=/Android/i.test(ua);

  var primary=document.getElementById('primary');
  var iosBtn=document.getElementById('ios');
  var aosBtn=document.getElementById('aos');
  iosBtn.href=IOS_STORE;
  aosBtn.href=AOS_STORE;

  if(isIOS){
    primary.href=IOS_APP;
    /* 페이지가 그려진 직후 자동 시도 (미설치 시 무시됨 → 스토어 버튼 노출) */
    setTimeout(function(){ location.href=IOS_APP; },300);
    setTimeout(function(){ iosBtn.classList.remove('hide'); },1800);
  }else if(isAndroid){
    primary.href=AOS_APP;
    setTimeout(function(){ location.href=AOS_APP; },300);
    setTimeout(function(){ aosBtn.classList.remove('hide'); },1800);
  }else{
    /* 데스크톱: 자동 이동 없이 양쪽 스토어 안내 */
    primary.classList.add('hide');
    iosBtn.classList.remove('hide');
    aosBtn.classList.remove('hide');
  }
})();
</script>
</body>
</html>
